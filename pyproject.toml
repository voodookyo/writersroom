[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writersroom"
version = "0.1.0"
description = "本地优先的影视创作研发工具：确定性分析核心 + 可选本地 LLM，默认完全离线"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "writersroom contributors"}]
dependencies = [
    "python-frontmatter>=1.3.0",
    "srt>=3.5.3",
    "webvtt-py>=0.5.1",
    "pypdf>=6.16.2",
]

[project.optional-dependencies]
docx = ["python-docx>=1.2.0"]
fountain = ["screenplain>=0.12.0"]
zh = ["jieba>=0.42.1"]
dev = [
    "pytest>=8.0",
    "pip-licenses>=5.0",
    "detect-secrets>=1.5",
    "cyclonedx-bom>=4.0",
]

[project.scripts]
writersroom = "writersroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
writersroom = ["data/lexicons/*.txt", "data/lexicons/*.json", "data/pipelines/*.json", "data/templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
